openapi: 3.0.3
info:
  title: LeadPhone Validator API
  version: 1.0.0
  description: High performance microservice in Go to parse, format, validate, and normalize international phone numbers with carrier, geocoding, and timezone metadata.

servers:
  - url: http://localhost:3007
    description: Local development server

paths:
  /:
    get:
      summary: Health check endpoint
      description: Returns service availability status and version.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health:
    get:
      summary: Health check endpoint alias
      description: Returns service availability status and version.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /validate:
    post:
      summary: Validate and format single phone number
      description: Parses single phone number, infers international dialing codes, extracts carrier and geocoding metadata, and generates formatted representations including WhatsApp click to chat links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/validate:
    post:
      summary: Validate and format single phone number (v1 alias)
      description: Versioned endpoint for single phone validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /validate/batch:
    post:
      summary: Validate multiple phone numbers in batch
      description: Concurrently validates an array of phone numbers using worker goroutines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchValidateRequest"
      responses:
        "200":
          description: Batch validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchValidationResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/validate/batch:
    post:
      summary: Validate multiple phone numbers in batch (v1 alias)
      description: Versioned endpoint for batch phone validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchValidateRequest"
      responses:
        "200":
          description: Batch validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchValidationResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ValidateRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "+55 (11) 98765-4321"
          description: Phone number in raw or formatted notation.
        country:
          type: string
          example: "BR"
          description: Optional ISO-2 country code hint.
        raw:
          type: string
          example: "11987654321"
          description: Optional fallback raw number field.

    BatchValidateRequest:
      type: object
      required:
        - phones
      properties:
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ValidateRequest"

    InputData:
      type: object
      properties:
        raw:
          type: string
          example: "+55 (11) 98765-4321"
        country:
          type: string
          nullable: true
          example: "BR"

    ParsedData:
      type: object
      properties:
        isValid:
          type: boolean
          example: true
        isPossible:
          type: boolean
          example: true
        type:
          type: string
          nullable: true
          example: "MOBILE"
        region:
          type: string
          nullable: true
          example: "BR"
        countryCode:
          type: integer
          nullable: true
          example: 55
        nationalNumber:
          type: integer
          nullable: true
          example: 11987654321
        needsDDD:
          type: boolean
          nullable: true
          example: false
        needsCountry:
          type: boolean
          nullable: true
          example: false
        reason:
          type: string
          nullable: true
          example: ""

    MetadataData:
      type: object
      nullable: true
      properties:
        carrier:
          type: string
          nullable: true
          example: "TIM"
        location:
          type: string
          nullable: true
          example: "São Paulo"
        timezones:
          type: array
          items:
            type: string
          example: ["America/Sao_Paulo"]

    FormattedData:
      type: object
      properties:
        e164:
          type: string
          example: "+5511987654321"
        international:
          type: string
          example: "+55 11 98765-4321"
        national:
          type: string
          example: "(11) 98765-4321"
        rfc3966:
          type: string
          example: "tel:+55-11-98765-4321"
        whatsapp:
          type: string
          example: "5511987654321"
        whatsappUrl:
          type: string
          example: "https://wa.me/5511987654321"

    ValidationResponse:
      type: object
      properties:
        input:
          $ref: "#/components/schemas/InputData"
        parsed:
          $ref: "#/components/schemas/ParsedData"
        metadata:
          $ref: "#/components/schemas/MetadataData"
        formatted:
          $ref: "#/components/schemas/FormattedData"

    BatchValidationResponse:
      type: object
      properties:
        total:
          type: integer
          example: 3
        valid:
          type: integer
          example: 2
        invalid:
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: "#/components/schemas/ValidationResponse"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        service:
          type: string
          example: "LeadPhone Validator"
        version:
          type: string
          example: "1.0.0"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid JSON payload"
        message:
          type: string
          example: "unexpected EOF"
